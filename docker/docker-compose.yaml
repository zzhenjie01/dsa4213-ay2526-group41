services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.33.3
    ports:
      - 8080:8080 # RESTful port
      - 50051:50051 # gRPC port
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true" # Enable access without authentication
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none" # No default vectorizer
      ENABLE_MODULES: "" # No modules enabled
      CLUSTER_HOSTNAME: "node1"
      GRPC_MAX_MESSAGE_SIZE: 67108864 # 64MB
      GOMEMLIMIT: "6GiB" # Set Go memory limit
    volumes:
      - weaviate_data:/var/lib/weaviate

volumes:
  weaviate_data: